<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="wa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6b75"/>
    </marker>
    <marker id="waAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8860b"/>
    </marker>
    <marker id="waGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="760" fill="#ffffff"/>

  <text x="840" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#143647">Agentic Delivery Pipeline</text>
  <text x="840" y="72" text-anchor="middle" font-size="13.5" fill="#5a6b75">Requirement to governed solution, human in the loop at every gate that matters</text>

  <!-- Row arrows (between boxes), y-center 360 -->
  <g stroke="#5a6b75" stroke-width="1.6" fill="none" marker-end="url(#wa)">
    <line x1="180" y1="360" x2="208" y2="360"/>
    <line x1="358" y1="360" x2="386" y2="360"/>
    <line x1="536" y1="360" x2="564" y2="360"/>
    <line x1="714" y1="360" x2="742" y2="360"/>
    <line x1="892" y1="360" x2="920" y2="360"/>
    <line x1="1070" y1="360" x2="1098" y2="360"/>
    <line x1="1248" y1="360" x2="1276" y2="360"/>
    <line x1="1426" y1="360" x2="1454" y2="360"/>
  </g>

  <!-- Boxes: 9 across, width 150, height 92, top y=314 -->
  <!-- helper layout: x = 30 + i*178 -->
  <!-- 0 Raw requirement (endpoint) -->
  <rect x="30" y="314" width="150" height="92" rx="9" fill="#d5dde2" stroke="#52616b" stroke-width="1.5"/>
  <text x="105" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#243640">Raw</text>
  <text x="105" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#243640">requirement</text>
  <text x="105" y="387" text-anchor="middle" font-size="9" fill="#4a5b66">email &#183; ticket &#183; doc</text>

  <!-- 1 Intake -->
  <rect x="208" y="314" width="150" height="92" rx="9" fill="#eaf2f7" stroke="#2f6d90" stroke-width="1.5"/>
  <text x="283" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#143647">Intake</text>
  <text x="283" y="379" text-anchor="middle" font-size="9" fill="#4a6779">parse &#183; register</text>

  <!-- 2 Architect -->
  <rect x="386" y="314" width="150" height="92" rx="9" fill="#eaf2f7" stroke="#2f6d90" stroke-width="1.5"/>
  <text x="461" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#143647">Architect</text>
  <text x="461" y="379" text-anchor="middle" font-size="9" fill="#4a6779">design &#183; risk flags</text>

  <!-- 3 Scaffold / onboard -->
  <rect x="564" y="314" width="150" height="92" rx="9" fill="#eaf2f7" stroke="#2f6d90" stroke-width="1.5"/>
  <text x="639" y="358" text-anchor="middle" font-size="12.5" font-weight="700" fill="#143647">Scaffold / onboard</text>
  <text x="639" y="377" text-anchor="middle" font-size="9" fill="#4a6779">new or existing repo</text>

  <!-- Brownfield entry above Scaffold / onboard -->
  <rect x="564" y="182" width="150" height="46" rx="9" fill="#d5dde2" stroke="#52616b" stroke-width="1.5"/>
  <text x="639" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#243640">Existing repo /</text>
  <text x="639" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#243640">portfolio</text>
  <line x1="639" y1="228" x2="639" y2="312" stroke="#5a6b75" stroke-width="1.6" marker-end="url(#wa)"/>
  <text x="648" y="272" text-anchor="start" font-size="8.5" fill="#8a6a1e">interrogate · survey gate</text>

  <!-- 4 Develop -->
  <rect x="742" y="314" width="150" height="92" rx="9" fill="#eaf2f7" stroke="#2f6d90" stroke-width="1.5"/>
  <text x="817" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#143647">Develop</text>
  <text x="817" y="379" text-anchor="middle" font-size="9" fill="#4a6779">traceability audits</text>

  <!-- 5 QA loop -->
  <rect x="920" y="314" width="150" height="92" rx="9" fill="#eaf2f7" stroke="#2f6d90" stroke-width="1.5"/>
  <text x="995" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#143647">QA loop</text>
  <text x="995" y="379" text-anchor="middle" font-size="9" fill="#4a6779">tester feedback</text>

  <!-- 6 Change gate (amber) -->
  <rect x="1098" y="314" width="150" height="92" rx="9" fill="#fbf3df" stroke="#b8860b" stroke-width="1.5"/>
  <text x="1173" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6b5310">Change gate</text>
  <text x="1173" y="379" text-anchor="middle" font-size="9" fill="#8a6a1e">approval to prod</text>

  <!-- 7 Publish docs -->
  <rect x="1276" y="314" width="150" height="92" rx="9" fill="#eaf2f7" stroke="#2f6d90" stroke-width="1.5"/>
  <text x="1351" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#143647">Publish docs</text>
  <text x="1351" y="379" text-anchor="middle" font-size="9" fill="#4a6779">architecture &#183; onboarding</text>

  <!-- 8 Deployed (endpoint) -->
  <rect x="1454" y="314" width="150" height="92" rx="9" fill="#d5dde2" stroke="#52616b" stroke-width="1.5"/>
  <text x="1529" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#243640">Deployed,</text>
  <text x="1529" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#243640">governed</text>
  <text x="1529" y="387" text-anchor="middle" font-size="9" fill="#4a5b66">solution</text>

  <!-- Analyst Q&A loop: above Architect (amber human gate) -->
  <rect x="386" y="180" width="150" height="46" rx="9" fill="#fbf3df" stroke="#b8860b" stroke-width="1.5"/>
  <text x="461" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#6b5310">Analyst Q&amp;A</text>
  <g stroke="#b8860b" stroke-width="1.5" fill="none">
    <line x1="447" y1="314" x2="447" y2="228" marker-end="url(#waAmber)"/>
    <line x1="475" y1="226" x2="475" y2="312" marker-end="url(#waAmber)"/>
  </g>
  <text x="416" y="270" text-anchor="end" font-size="9" fill="#8a6a1e">questions</text>
  <text x="506" y="270" text-anchor="start" font-size="9" fill="#8a6a1e">answers</text>

  <!-- Defects loop: QA back to Develop, arc above the row -->
  <path d="M962,314 C962,250 850,250 830,312" stroke="#5a6b75" stroke-width="1.6" fill="none" marker-end="url(#wa)"/>
  <text x="896" y="248" text-anchor="middle" font-size="10" fill="#5a6b75">defects</text>

  <!-- runmeter: below the row, centered under Develop/QA -->
  <rect x="820" y="520" width="220" height="70" rx="10" fill="#e3f3ea" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="930" y="551" text-anchor="middle" font-size="15" font-weight="700" fill="#124d31">runmeter</text>
  <text x="930" y="570" text-anchor="middle" font-size="10" fill="#2f7a54">cost &#183; latency &#183; reliability</text>
  <text x="930" y="616" text-anchor="middle" font-size="10" fill="#1f7a4d">every stage emits telemetry</text>
  <g stroke="#1f7a4d" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#waGreen)">
    <path d="M461,406 C461,470 720,470 862,518"/>
    <line x1="817" y1="406" x2="905" y2="518"/>
    <path d="M995,406 C995,460 1000,470 970,518"/>
  </g>

  <text x="840" y="712" text-anchor="middle" font-size="11" fill="#8a97a0">Aptica Solutions &#183; profile-driven &#183; toolchain-agnostic &#183; stateful and resumable &#183; human-in-the-loop</text>
</svg>
